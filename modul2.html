<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Form Biodata</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h3 class="text-center mb-4">Form Biodata</h3>

      <form id="biodataForm" class="card p-4 shadow-sm">
        <input
          type="text"
          class="form-control mb-2"
          id="nim"
          placeholder="NIM"
          required
        />
        <input
          type="text"
          class="form-control mb-2"
          id="nama"
          placeholder="Nama"
          required
        />
        <input type="date" class="form-control mb-2" id="tgl" required />

        <div class="mb-2">
          <input type="radio" name="jk" value="Laki-laki" required /> Laki-laki
          <input type="radio" name="jk" value="Perempuan" /> Perempuan
        </div>

        <select class="form-select mb-2" id="agama" required>
          <option value="">-- Pilih Agama --</option>
          <option>Islam</option>
          <option>Kristen</option>
        </select>

        <textarea
          class="form-control mb-2"
          id="alamat"
          placeholder="Alamat"
          required
        ></textarea>

        <button type="submit" class="btn btn-primary">Submit</button>
      </form>

      <table class="table table-bordered mt-4">
        <thead class="table-dark">
          <tr>
            <th>NIM</th>
            <th>Nama</th>
            <th>Tanggal</th>
            <th>JK</th>
            <th>Agama</th>
            <th>Alamat</th>
          </tr>
        </thead>
        <tbody id="tabelData"></tbody>
      </table>
    </div>

    <script>
      document
        .getElementById("biodataForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          try {
            const nim = document.getElementById("nim").value;
            const nama = document.getElementById("nama").value;
            const tgl = document.getElementById("tgl").value;

            const jkElement = document.querySelector(
              'input[name="jk"]:checked',
            );
            if (!jkElement) {
              alert("Pilih jenis kelamin!");
              return;
            }
            const jk = jkElement.value;

            const agama = document.getElementById("agama").value;
            const alamat = document.getElementById("alamat").value;

            const tabel = document.getElementById("tabelData");

            const row = document.createElement("tr");
            row.innerHTML = `
            <td>${nim}</td>
            <td>${nama}</td>
            <td>${tgl}</td>
            <td>${jk}</td>
            <td>${agama}</td>
            <td>${alamat}</td>
        `;

            tabel.appendChild(row);

            document.getElementById("biodataForm").reset();
          } catch (error) {
            console.log(error);
            alert("Terjadi error, cek console (F12)");
          }
        });
    </script>
  </body>
</html>
